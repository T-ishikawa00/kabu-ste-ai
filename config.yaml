# ★★★ 一点突破モード (資金管理の要) ★★★
portfolio:
  max_open_positions: 3

safety:
  api_latency_ms_limit: 1500
  pause_on_latency: true
  spike_pct: 3.5
  spike_window_sec: 3
  pause_after_spike_sec: 60
  board_min_interval_ms: 900
  api_qps_limit: 6
  kill_switch_file: runtime/kill.txt
  holdid_wait_ms: 3000
  poll_interval_ms: 50
  cooldown_after_exit_sec: 1.2
  streak_pause_sec: 90

entry:
  theta: 0.55

exit:
  trail_back_pct: 0.008
  trail_start_pct: 0.005
  max_hold_sec: 1800     # ★全体設定も30分(1800秒)へ
  rules:
    max_spread_ticks_mean_5m: 1.0
    min_vol_1m_mean_5m: 8000
    obi_mean_high: 0.58
    obi_mean_low: 0.42
  hysteresis:
    add_required_hits: 2
    drop_required_hits: 3

learning:
  enable_auto_train: false
  auto_train_time: "16:30"
  lookback_days: 7
  micro_go_live_enabled: true
  challenger_share: 0.10

