api:
  base: http://localhost:18080/kabusapi
  api_password: Htk050313
  trade_password: Htk_222305
  timeout_get_sec: 10
  timeout_post_sec: 10

telemetry_path: runtime/telemetry.json

# ★テスト中はtrue, 本番はfalse
paper_trading: false

# 注文設定
orders:
  style: "market"
  ioc: false
  cap_ticks_entry: 10
  cap_ticks_exit: 10
  retry:
    enabled: true
    max_attempts: 2
    widen_ticks_each: 1
    wait_ms_between: 100

risk:
  no_new_entry_after: "14:50"
  force_close_time: "14:55"
  max_daily_loss_jpy: 30000 

# ==========================================
# ★★★ 空売り設定 ★★★
