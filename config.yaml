  enabled: true
  allowed_symbols:
    - "8411"
    - "9984"
    - "9107"
    - "7011"
    - "7013"
    - "7974"
    - "285A"
    - "6269"
    - "7003"
    - "9501"
    - "8136"

  min_distance_to_limit_up_pct: 2.0
  max_dsr: 4.0
  
  no_entry_after: "14:30"
  force_close_time: "14:50"
  
  # ★空売りは買いより厳しめ
  sl_ticks: 10
  tp_ticks: 20
  max_hold_sec: 300
  
  panic_on_special_quote: true
  panic_distance_pct: 1.0

