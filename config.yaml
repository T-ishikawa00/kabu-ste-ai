# ==========================================
#  Kabu-Ste-AI Config (Future Expansion)
# ==========================================

api:
  base: http://localhost:18080/kabusapi
  api_password: Htk050313
  trade_password: Htk_222305

telemetry_path: runtime/telemetry.json

# ★本番！ ...ではなく月曜はテストなので true になっています (Good!)
paper_trading: true

# 注文設定
orders:
  style: "marketable_limit"
  ioc: true
  cap_ticks_entry: 2
  cap_ticks_exit: 3
  cap_pct_entry: 0.30
  cap_pct_exit: 0.50
  retry:
    enabled: true
    max_attempts: 2
    widen_ticks_each: 1
    wait_ms_between: 200
  forbid_market_on_5yen: true
  buy:  { front_order_type: 20, margin_trade_type: 3 }
  sell: { front_order_type: 20, margin_trade_type: 3 }

risk:
  no_new_entry_after: "14:50"
  force_close_time: "14:55"

# ★★★ 5銘柄体制へ拡張 ★★★
symbols:
  # --- エース: 北海道電力 (AI参謀つき) ---
  - code: "9509"
    exchange: 1
    qty: 300
    min_order_interval_sec: 5
    tp_ticks_cap: 25   # 利確: 25tick
    sl_ticks_cap: 12   # 損切: 12tick
    max_hold_sec: 300  # 時間: 5分

  # --- サブ: 東京電力 ---
  - code: "9501"
    exchange: 1
    qty: 100
    min_order_interval_sec: 5
    tp_ticks_cap: 25
    sl_ticks_cap: 12
    max_hold_sec: 300

  # --- [NEW] 半導体ラスボス: レーザーテック ---
  # 値動きが激しいのでデータ収集に最適
  - code: "6920"
    exchange: 1
    qty: 100           # 単元が高い(200万~)のでPaperでも100推奨
    min_order_interval_sec: 5
    tp_ticks_cap: 30   # ボラが巨大なので少し広め
    sl_ticks_cap: 15
    max_hold_sec: 300

  # --- [NEW] 金融代表: 三菱UFJ ---
  # 金利で動く重厚な銘柄
  - code: "8306"
    exchange: 1
    qty: 100
    min_order_interval_sec: 5
    tp_ticks_cap: 20   # 刻みが細かいので標準的設定
    sl_ticks_cap: 10
    max_hold_sec: 300

  # --- [NEW] 日経連動: ソフトバンクG ---
  # AI投資の代表格
  - code: "9984"
    exchange: 1
    qty: 100
    min_order_interval_sec: 5
    tp_ticks_cap: 25
    sl_ticks_cap: 12
    max_hold_sec: 300

# ★重要: 同時に監視する銘柄数を5に増やす
max_concurrent_symbols: 5

portfolio:
  # ★重要: 同時に持てるポジション数も増やす（データ取り逃がし防止）
  max_open_positions: 5

safety:
  api_latency_ms_limit: 1500
  pause_on_latency: true
  spike_pct: 3.5
  spike_window_sec: 3
  pause_after_spike_sec: 60
  board_min_interval_ms: 900
  api_qps_limit: 6
  kill_switch_file: runtime/kill.txt
  holdid_wait_ms: 3000
  poll_interval_ms: 50
  cooldown_after_exit_sec: 1.2
  streak_pause_sec: 90

entry:
  theta: 0.55

exit:
  trail_back_pct: 0.008
  trail_start_pct: 0.02
  max_hold_sec: 120
  rules:
    max_spread_ticks_mean_5m: 1.0
    min_vol_1m_mean_5m: 8000
    obi_mean_high: 0.58
    obi_mean_low: 0.42
  hysteresis:
    add_required_hits: 2
    drop_required_hits: 3

learning:
  enable_auto_train: true
  auto_train_time: "16:30"
  lookback_days: 7
  micro_go_live_enabled: true
  challenger_share: 0.10

gatekeeper:
  enabled: false
  allowed_symbols:
    - "9501"
    - "9509"
    - "6920"
    - "8306"
    - "9984"

rotation:
  enabled: false
  recompute_sec: 60
  max_watchlist: 10
  min_watchlist: 5

strategies:
  SCALP:
    tp_ticks: 1
    sl_ticks: 1
    max_hold_sec: 25
    max_spread_ticks: 3
    heat_entry: 0.64
    exit_drop: 0.45

  MINI_SWING:
    tp_ticks_cap: 20
    sl_ticks_cap: 10
    max_hold_sec: 300
    max_spread_ticks: 3
    heat_exit_drop: 0.20
    obi_flip: 0.10
    vwap_distance_max: 0.40

router:
  prefer_swing_if:
    heat: 0.70
    vwap_distance: 0.30
    spread_ticks: 2
    vol_boost_ratio: 1.2
    market_temp: 0.50
  forbid_entry_if:
    spread_ticks: 6
    vol_rank: 0.10
    price_step: 5