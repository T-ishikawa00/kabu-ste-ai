api:
  base: http://localhost:18080/kabusapi
  api_password: Htk050313
  trade_password: Htk_222305

telemetry_path: runtime/telemetry.json

entry:
  theta: 0.55

exit:
  trail_back_pct: 0.008
  trail_start_pct: 0.02
  # controller側のSWINGと合わせて、とりあえず40秒に揃えておく
  max_hold_sec: 40
  rules:
    max_spread_ticks_mean_5m: 1.0
    min_vol_1m_mean_5m: 8000
    obi_mean_high: 0.58
    obi_mean_low: 0.42
  hysteresis:
    add_required_hits: 2
    drop_required_hits: 3

learning:
  enable_auto_train: true
  auto_train_time: "16:30"
  lookback_days: 7
  micro_go_live_enabled: true
  challenger_share: 0.10

risk:
  no_new_entry_after: "14:50"
  force_close_time: "14:55"

safety:
  api_latency_ms_limit: 1500
  pause_on_latency: true
  spike_pct: 3.5
  spike_window_sec: 3
  pause_after_spike_sec: 60
  board_min_interval_ms: 900
  api_qps_limit: 6
  kill_switch_file: runtime/kill.txt
  holdid_wait_ms: 3000
  poll_interval_ms: 50
  cooldown_after_exit_sec: 1.2
  streak_pause_sec: 90

paper_trading: true

orders:
  style: "marketable_limit"
  ioc: true
  cap_ticks_entry: 2
  cap_ticks_exit: 3
  cap_pct_entry: 0.30
  cap_pct_exit: 0.50
  retry:
    enabled: true
    max_attempts: 2
    widen_ticks_each: 1
    wait_ms_between: 200
  forbid_market_on_5yen: true
  buy:  { front_order_type: 20, margin_trade_type: 3 }
  sell: { front_order_type: 20, margin_trade_type: 3 }

gatekeeper:
  enabled: false         # 自分で銘柄決めるので門番はOFFのまま
  allowed_symbols:
    - "9501"

portfolio:
  max_open_positions: 1  # 1銘柄 / 1ポジ固定

rotation:
  enabled: false         # 1銘柄運用なのでローテーション無効化
  recompute_sec: 60
  max_watchlist: 10
  min_watchlist: 5

# Controllerは len(symbols) を優先するが、明示的に1にしておく
max_concurrent_symbols: 1

symbols:
  # 東京電力HD
  - { code: "9501", exchange: 1, qty: 100, min_order_interval_sec: 5 }

strategies:
  # ここは「設定としての見た目」を controller の SWING 定義と揃えておく
  SCALP:
    tp_ticks: 1
    sl_ticks: 1
    max_hold_sec: 25
    max_spread_ticks: 3
    heat_entry: 0.64
    exit_drop: 0.45

  MINI_SWING:
    tp_ticks_cap: 8      # controller.SWING と同じ
    sl_ticks_cap: 3
    max_hold_sec: 40
    max_spread_ticks: 2
    heat_exit_drop: 0.40
    obi_flip: 0.10
    vwap_distance_max: 0.35

router:
  prefer_swing_if:
    heat: 0.70
    vwap_distance: 0.30
    spread_ticks: 2
    vol_boost_ratio: 1.2
    market_temp: 0.50
  forbid_entry_if:
    spread_ticks: 6
    vol_rank: 0.10
    price_step: 5


