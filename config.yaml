api:
  base: http://localhost:18080/kabusapi
  api_password: Htk050313
  trade_password: Htk_222305

telemetry_path: runtime/telemetry.json

# ★AI育成・乱射モードのため Paper Trading ON
paper_trading: true

# 注文設定
orders:
  style: "marketable_limit"
  ioc: true
  cap_ticks_entry: 2
  cap_ticks_exit: 5      # 余裕を持たせる
  cap_pct_entry: 0.30
  cap_pct_exit: 0.50
  retry:
    enabled: true
    max_attempts: 3      # 粘る
    widen_ticks_each: 1
    wait_ms_between: 200
  forbid_market_on_5yen: true
  buy:  { front_order_type: 20, margin_trade_type: 3 }
  sell: { front_order_type: 20, margin_trade_type: 3 }

risk:
  no_new_entry_after: "14:50"
  force_close_time: "14:55"
  max_daily_loss_jpy: 50000 

