max_concurrent_symbols: 25

portfolio:
  max_open_positions: 25

safety:
  api_latency_ms_limit: 1500
  pause_on_latency: true
  spike_pct: 3.5
  spike_window_sec: 3
  pause_after_spike_sec: 60
  board_min_interval_ms: 900
  api_qps_limit: 6
  kill_switch_file: runtime/kill.txt
  holdid_wait_ms: 3000
  poll_interval_ms: 50
  cooldown_after_exit_sec: 1.2
  streak_pause_sec: 90

entry:
  theta: 0.55

exit:
  trail_back_pct: 0.008
  trail_start_pct: 0.02
  max_hold_sec: 3600 # ★ここも一応合わせておく
  rules:
    max_spread_ticks_mean_5m: 1.0
    min_vol_1m_mean_5m: 8000
    obi_mean_high: 0.58
    obi_mean_low: 0.42
  hysteresis:
    add_required_hits: 2
    drop_required_hits: 3

learning:
  enable_auto_train: true
  auto_train_time: "16:30"
  lookback_days: 7
  micro_go_live_enabled: true
  challenger_share: 0.10

gatekeeper:
  enabled: true
  allowed_symbols:
    # 22銘柄全部許可
    - "9501" 
    - "9509" 
    - "8306" 
    - "8411" 
    - "7014" 
    - "7003" 
    - "7011" 
    - "7203" 
    - "7267" 
    - "5401" 
    - "9107" 
    - "6526" 
    - "6506" 
    - "5803" 
    - "6758" 
    - "8058" 
    - "8031" 
    - "285A" 
    - "7974" 
    - "9984" 
    - "6920" 
    - "6146" 
    - "6954" 

rotation:
  enabled: false
  recompute_sec: 60
  max_watchlist: 10
  min_watchlist: 5

strategies:
  SCALP:
    tp_ticks: 2
    sl_ticks: 2
    max_hold_sec: 60
    max_spread_ticks: 5
    heat_entry: 0.64
    exit_drop: 0.45

  MINI_SWING:
    # ★ここも師匠設定に合わせる
    tp_ticks_cap: 60     # 20 -> 60
    sl_ticks_cap: 25     # 10 -> 25
    max_hold_sec: 3600   # 300 -> 3600
    max_spread_ticks: 5
    heat_exit_drop: 0.20
    obi_flip: 0.10
    vwap_distance_max: 0.40

router:
  prefer_swing_if:
    heat: 0.70
    vwap_distance: 0.30
    spread_ticks: 2
    vol_boost_ratio: 1.2
    market_temp: 0.50
  forbid_entry_if:
    spread_ticks: 6
    vol_rank: 0.10
    price_step: 5