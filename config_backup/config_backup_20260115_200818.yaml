# ==========================================
#   Kabu-Ste-AI Config v14.0 (Hybrid Mode)
#   ★固定枠7銘柄 + 日替わり枠5銘柄
# ==========================================


# ==========================================
# API設定
# ==========================================
api:
  base: http://localhost:18080/kabusapi
  api_password: Htk050313
  trade_password: Htk_222305
  timeout_get_sec: 10
  timeout_post_sec: 10

telemetry_path: runtime/telemetry.json


# ==========================================
# 取引モード   練習：true　　実践：false
# ==========================================
paper_trading: false


# ==========================================
# 注文設定
# ==========================================
orders:
  style: "market"
  ioc: false
  cap_ticks_entry: 10
  cap_ticks_exit: 10
  retry:
    enabled: true
    max_attempts: 2
    widen_ticks_each: 1
    wait_ms_between: 100


# ==========================================
# リスク管理
# ==========================================
risk:
  no_new_entry_after: "14:50"
  force_close_time: "14:55"
  max_daily_loss_jpy: 30000


# ==========================================
# 空売り設定
# ==========================================
short:
  enabled: true
  allowed_symbols: []
  min_distance_to_limit_up_pct: 2.0
  max_dsr: 4.0
  no_entry_after: "14:30"
  force_close_time: "14:50"
  sl_ticks: 30
  tp_ticks: 40
  max_hold_sec: 900
  panic_on_special_quote: true
  panic_distance_pct: 1.0


# ==========================================
# 共通戦略設定（利確・損切）
# ==========================================
common:
  tp_ticks: 40      # 利確
  sl_ticks: 30      # 損切
  max_hold_sec: 900 # 最大保有


# ==========================================
# 銘柄設定
# ==========================================
symbols:

  # ─────────────────────────────────────────
  # 【固定枠】毎日監視する主力銘柄
