  - code: "92270"
    exchange: 1
    qty: 100
    fixed: false
    tp_ticks_cap: 20
    sl_ticks_cap: 10
    max_hold_sec: 300


# ==========================================
# ポートフォリオ設定
# ==========================================
max_concurrent_symbols: 25

portfolio:
  max_open_positions: 3


# ==========================================
# 安全設定
# ==========================================
safety:
  api_latency_ms_limit: 2500
  pause_on_latency: true
  api_qps_limit: 5
  board_min_interval_ms: 500
  min_order_interval_sec: 1
  order_confirm_timeout_sec: 8
  api_call_interval_sec: 0.2
  spike_pct: 4.0
  spike_window_sec: 3
  pause_after_spike_sec: 30
  kill_switch_file: runtime/kill.txt
  holdid_wait_ms: 2000
  poll_interval_ms: 20
  cooldown_after_exit_sec: 2.0
  streak_pause_sec: 30


# ==========================================
# エントリー・エグジット設定
# ==========================================
entry:
  theta: 0.60

exit:
  trail_back_pct: 0.005
  trail_start_pct: 0.003
  max_hold_sec: 900


# ==========================================
# 自動学習（無効）
# ==========================================
learning:
  enable_auto_train: false


# ==========================================
# Gatekeeper（取引許可リスト）
# ==========================================
gatekeeper:
  enabled: true
  whitelist:
    # 固定枠
    - "285A" 
    - "6269" 
    - "9984" 
    - "6954" 
    - "7011" 
    - "8411" 
    - "9501" 
    # 日替わり枠
    - "92520" 
    - "91600" 
    - "88870" 
    - "98880" 
    - "92270" 


# ==========================================
# 戦略設定
# ==========================================
strategies:
  MINI_SWING:
    pass_placeholder: true

router:
  prefer_swing_if:
    heat: 0.50
    vwap_distance: 0.40
    spread_ticks: 3
    vol_boost_ratio: 1.0
    market_temp: 0.40
  forbid_entry_if:
    spread_ticks: 8
    vol_rank: 0.05
    price_step: 100


